name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ci:
    name: CI チェック
    runs-on: ubuntu-latest

    steps:
      - name: コードをチェックアウト
        uses: actions/checkout@v4

      - name: pnpm をセットアップ
        uses: pnpm/action-setup@v4

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile

      - name: TypeScript 型チェック
        run: pnpm typecheck

      - name: ESLint 静的解析
        run: pnpm lint

      - name: テスト実行（カバレッジ 100% 検証）
        run: pnpm test

      # ビルド時に microCMS から記事一覧を取得する(generateStaticParams)ため、
      # 認証情報が必要。以前はコミット済みの .env から供給されていたが、
      # .env を追跡から外したのでリポジトリ Secrets から渡す。
      - name: プロダクションビルド
        run: pnpm build
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
